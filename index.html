<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>JPG to PDF Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body {
      background-color: #020617;
      background-image: radial-gradient(circle at top left, rgba(56, 189, 248, 0.16), transparent 24%), radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.16), transparent 24%), linear-gradient(135deg, #020617 0%, #111827 100%);
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.16);
      box-shadow: 0 30px 90px rgba(14, 30, 60, 0.45);
      backdrop-filter: blur(24px);
      border-radius: 28px;
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0) 42%), radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.18), transparent 28%);
      pointer-events: none;
    }

    .glass-card > * {
      position: relative;
      z-index: 1;
    }

    .cyber-heading {
      color: #dbeafe;
      text-shadow: 0 0 18px rgba(56, 189, 248, 0.35);
    }

    .cyber-subtitle {
      color: #cbd5e1;
    }

    .glass-button {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.06), 0 18px 40px rgba(56, 189, 248, 0.08);
      backdrop-filter: blur(12px);
    }

    .glass-button:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.6);
    }

    .glass-button-accent {
      background: rgba(236, 72, 153, 0.16);
      border-color: rgba(236, 72, 153, 0.4);
      box-shadow: 0 0 0 1px rgba(236, 72, 153, 0.08), 0 18px 40px rgba(236, 72, 153, 0.08);
    }

    .glass-button-accent:hover {
      background: rgba(236, 72, 153, 0.22);
      border-color: rgba(236, 72, 153, 0.7);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="script.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-xl glass-card p-8">
    <h1 class="text-2xl font-bold text-center cyber-heading">🖼️ JPG → PDF Converter</h1>
    <p class="text-center cyber-subtitle mt-2">แปลงรูปภาพ JPG เป็นไฟล์ PDF ได้ทันทีในเบราว์เซอร์</p>

    <div class="mt-6">
      <label class="block text-sm font-medium text-white mb-2">เลือกรูปภาพ (JPG / JPEG)</label>
      <input id="imageInput" type="file" accept="image/jpeg" multiple
        class="block w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-slate-800 file:text-white hover:file:bg-slate-700 cursor-pointer" />
    </div>
    <p class="text-sm text-slate-500 mt-2">สำหรับสำเนาทะเบียนบ้าน ให้เลือก 2 รูปเรียงตามลำดับบน-ล่าง (รูปแรกบน รูปที่สองล่าง) และจะแปลงเป็นขนาดจริง 22.8 x 15.5 ซม.</p>

    <div id="preview" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 mt-6"></div>

    <!-- Loading Overlay -->
    <div id="loading" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
      <div class="bg-white rounded-2xl p-6 flex flex-col items-center gap-4 shadow-xl">
        <svg class="animate-spin h-10 w-10 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
        <p class="text-slate-700 font-medium">กำลังแปลงไฟล์เป็น PDF...</p>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mt-6">
      <button onclick="convertToPDF(false)"
        class="glass-button text-white font-semibold py-3 rounded-2xl transition">
        ดูไฟล์ PDF
      </button>
      <button onclick="convertToPDF(true)"
        class="glass-button text-white font-semibold py-3 rounded-2xl transition">
        ดาวน์โหลด PDF
      </button>
      <button onclick="convertToPDFSmall(false)"
        class="glass-button text-white font-semibold py-3 rounded-2xl transition">
        ดูไฟล์ PDF (รูปไม่เต็มหน้า)
      </button>
      <button onclick="convertToPDFSmall(true)"
        class="glass-button text-white font-semibold py-3 rounded-2xl transition">
        ดาวน์โหลด PDF (รูปไม่เต็มหน้า)
      </button>
      <button onclick="convertToIDCard(false)"
        class="glass-button-accent text-white font-semibold py-3 rounded-2xl transition">
        ดูบัตรประชาชน
      </button>
      <button onclick="convertToIDCard(true)"
        class="glass-button-accent text-white font-semibold py-3 rounded-2xl transition">
        ดาวน์โหลดบัตรประชาชน
      </button>
      <button onclick="convertToHouseCopy(false)"
        class="glass-button text-white font-semibold py-3 rounded-2xl transition">
        ดูสำเนาทะเบียนบ้าน
      </button>
      <button onclick="convertToHouseCopy(true)"
        class="glass-button text-white font-semibold py-3 rounded-2xl transition">
        ดาวน์โหลดสำเนาทะเบียนบ้าน
      </button>
      <button onclick="convertToA4Grid(false)"
        class="glass-button text-white font-semibold py-3 rounded-2xl transition">
        ดูหลายรูปบน A4
      </button>
      <button onclick="convertToA4Grid(true)"
        class="glass-button text-white font-semibold py-3 rounded-2xl transition">
        ดาวน์โหลดหลายรูปบน A4
      </button>
    </div>

    <p class="text-xs text-center text-slate-400 mt-4">ไฟล์จะไม่ถูกอัปโหลดขึ้นเซิร์ฟเวอร์ (ทำงานบนเครื่องคุณ)</p>
  </div>

</body>
</html>

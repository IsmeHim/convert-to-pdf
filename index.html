<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>JPG to PDF Converter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800 flex items-center justify-center p-4">

  <div class="w-full max-w-xl bg-white/95 backdrop-blur rounded-2xl shadow-2xl p-8">
    <h1 class="text-2xl font-bold text-center text-slate-800">🖼️ JPG → PDF Converter</h1>
    <p class="text-center text-slate-500 mt-2">แปลงรูปภาพ JPG เป็นไฟล์ PDF ได้ทันทีในเบราว์เซอร์</p>

    <div class="mt-6">
      <label class="block text-sm font-medium text-slate-700 mb-2">เลือกรูปภาพ (JPG / JPEG)</label>
      <input id="imageInput" type="file" accept="image/jpeg" multiple
        class="block w-full text-sm text-slate-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-slate-800 file:text-white hover:file:bg-slate-700 cursor-pointer" />
    </div>
    <p class="text-sm text-slate-500 mt-2">สำหรับสำเนาทะเบียนบ้าน ให้เลือก 2 รูปเรียงตามลำดับบน-ล่าง (รูปแรกบน รูปที่สองล่าง) และจะแปลงเป็นขนาดจริง 22.8 x 15.5 ซม.</p>

    <div id="preview" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 mt-6"></div>

    <!-- Loading Overlay -->
    <div id="loading" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
      <div class="bg-white rounded-2xl p-6 flex flex-col items-center gap-4 shadow-xl">
        <svg class="animate-spin h-10 w-10 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
        <p class="text-slate-700 font-medium">กำลังแปลงไฟล์เป็น PDF...</p>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mt-6">
      <button onclick="convertToPDF(false)"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition">
        ดูไฟล์ PDF
      </button>
      <button onclick="convertToPDF(true)"
        class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition">
        ดาวน์โหลด PDF
      </button>
      <button onclick="convertToPDFSmall(false)"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition">
        ดูไฟล์ PDF (รูปไม่เต็มหน้า)
      </button>
      <button onclick="convertToPDFSmall(true)"
        class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl transition">
        ดาวน์โหลด PDF (รูปไม่เต็มหน้า)
      </button>
      <button onclick="convertToIDCard(false)"
        class="bg-amber-600 hover:bg-amber-700 text-white font-semibold py-3 rounded-xl transition">
        ดูบัตรประชาชน
      </button>
      <button onclick="convertToIDCard(true)"
        class="bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 rounded-xl transition">
        ดาวน์โหลดบัตรประชาชน
      </button>
      <button onclick="convertToHouseCopy(false)"
        class="bg-amber-500 hover:bg-amber-600 text-white font-semibold py-3 rounded-xl transition">
        ดูสำเนาทะเบียนบ้าน
      </button>
      <button onclick="convertToHouseCopy(true)"
        class="bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl transition">
        ดาวน์โหลดสำเนาทะเบียนบ้าน
      </button>
      <button onclick="convertToA4Grid(false)"
        class="bg-sky-600 hover:bg-sky-700 text-white font-semibold py-3 rounded-xl transition">
        ดูหลายรูปบน A4
      </button>
      <button onclick="convertToA4Grid(true)"
        class="bg-cyan-600 hover:bg-cyan-700 text-white font-semibold py-3 rounded-xl transition">
        ดาวน์โหลดหลายรูปบน A4
      </button>
    </div>

    <p class="text-xs text-center text-slate-400 mt-4">ไฟล์จะไม่ถูกอัปโหลดขึ้นเซิร์ฟเวอร์ (ทำงานบนเครื่องคุณ)</p>
  </div>

  <script>
    const input = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    let selectedFiles = []; // เก็บรูปที่เลือก

    function updatePreview() {
      preview.innerHTML = '';
      selectedFiles.forEach((file, index) => {
        const container = document.createElement('div');
        container.className = 'relative group';

        const img = document.createElement('img');
        img.className = 'w-full h-24 object-cover rounded-lg border';
        img.src = URL.createObjectURL(file);

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'absolute -top-2 -right-2 bg-red-500 hover:bg-red-600 text-white rounded-full w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center text-sm sm:text-base opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition shadow-lg';
        deleteBtn.innerHTML = '✕';
        deleteBtn.onclick = (e) => {
          e.preventDefault();
          removeImage(index);
        };

        container.appendChild(img);
        container.appendChild(deleteBtn);
        preview.appendChild(container);
      });
    }

    function removeImage(index) {
      selectedFiles.splice(index, 1);
      updatePreview();
    }

    input.addEventListener('change', () => {
      selectedFiles = [...selectedFiles, ...input.files];
      input.value = '';
      updatePreview();
    });

    async function convertToPDF(download) {
      if (!selectedFiles.length) {
        alert('กรุณาเลือกรูปก่อน');
        return;
      }

      const loading = document.getElementById('loading');
      loading.classList.remove('hidden');

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        const imgData = await fileToBase64(file);
        const img = new Image();
        img.src = imgData;

        await new Promise(resolve => img.onload = resolve);

        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = (img.height * pageWidth) / img.width;

        if (i > 0) pdf.addPage();
        pdf.addImage(img, 'JPEG', 0, 0, pageWidth, pageHeight);
      }

      if (download) {
        pdf.save('images.pdf');
      } else {
        const blobUrl = pdf.output('bloburl');
        window.open(blobUrl, '_blank');
      }

      loading.classList.add('hidden');
    }

    async function convertToPDFSmall(download) {
      if (!selectedFiles.length) {
        alert('กรุณาเลือกรูปก่อน');
        return;
      }

      const loading = document.getElementById('loading');
      loading.classList.remove('hidden');

      const { jsPDF } = window.jspdf;

      // ใช้ A4
      const pdf = new jsPDF('p', 'mm', 'a4');

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        const imgData = await fileToBase64(file);
        const img = new Image();
        img.src = imgData;

        await new Promise(resolve => img.onload = resolve);

        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();

        // 👇 ปรับขนาดรูปให้เล็กลง (เช่น 70% ของหน้ากระดาษ)
        const maxWidth = pageWidth * 0.7;
        const maxHeight = pageHeight * 0.7;

        let imgWidth = maxWidth;
        let imgHeight = (img.height * imgWidth) / img.width;

        if (imgHeight > maxHeight) {
          imgHeight = maxHeight;
          imgWidth = (img.width * imgHeight) / img.height;
        }

        // 👇 จัดให้อยู่กึ่งกลาง
        const x = (pageWidth - imgWidth) / 2;
        const y = (pageHeight - imgHeight) / 2;

        if (i > 0) pdf.addPage();
        pdf.addImage(img, 'JPEG', x, y, imgWidth, imgHeight);
      }

      if (download) {
        pdf.save('images-small.pdf');
      } else {
        const blobUrl = pdf.output('bloburl');
        window.open(blobUrl, '_blank');
      }

      loading.classList.add('hidden');
    }

    async function convertToIDCard(download) {
      if (!selectedFiles.length) {
        alert('กรุณาเลือกรูปก่อน');
        return;
      }

      const loading = document.getElementById('loading');
      loading.classList.remove('hidden');

      const { jsPDF } = window.jspdf;

      // ใช้ A4 สำหรับปริ้น และวาดบัตรประชาชนขนาดจริงตรงกลางด้านบน
      const pdf = new jsPDF('p', 'mm', 'a4');
      const pageWidth = pdf.internal.pageSize.getWidth();
      const cardWidth = 85.6;
      const cardHeight = 53.98;
      const marginTop = 40;
      const cardX = (pageWidth - cardWidth) / 2;
      const cardY = marginTop;

      for (let i = 0; i < selectedFiles.length; i++) {
        if (i > 0) pdf.addPage();

        const file = selectedFiles[i];
        const imgData = await fileToBase64(file);
        const img = new Image();
        img.src = imgData;

        await new Promise(resolve => img.onload = resolve);

        // วาดพื้นหลังบัตรและขอบ
        pdf.setFillColor(255, 255, 255);
        pdf.rect(cardX, cardY, cardWidth, cardHeight, 'F');
        pdf.setDrawColor(120);
        pdf.setLineWidth(0.3);
        pdf.rect(cardX, cardY, cardWidth, cardHeight, 'S');

        // ปรับขนาดรูปให้พอดีกับบัตรประชาชนโดยรักษาสัดส่วน
        const scale = Math.min(cardWidth / img.width, cardHeight / img.height);
        const imgWidth = img.width * scale;
        const imgHeight = img.height * scale;
        const imgX = cardX + (cardWidth - imgWidth) / 2;
        const imgY = cardY + (cardHeight - imgHeight) / 2;

        pdf.addImage(img, 'JPEG', imgX, imgY, imgWidth, imgHeight);
      }

      if (download) {
        pdf.save('id-card-a4.pdf');
      } else {
        const blobUrl = pdf.output('bloburl');
        window.open(blobUrl, '_blank');
      }

      loading.classList.add('hidden');
    }

    async function convertToHouseCopy(download) {
      if (!selectedFiles.length) {
        alert('กรุณาเลือกรูปก่อน');
        return;
      }
      if (selectedFiles.length < 2) {
        alert('สำหรับสำเนาทะเบียนบ้าน ต้องเลือก 2 รูป เรียงตามลำดับบน-ล่าง');
        return;
      }

      const loading = document.getElementById('loading');
      loading.classList.remove('hidden');

      const { jsPDF } = window.jspdf;
      // ใช้ A4 แนวตั้ง (หน่วย mm: กว้าง 210, สูง 297)
      const pdf = new jsPDF('p', 'mm', 'a4');
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      
      const margin = 6;    // ระยะขอบบน (ลดลง เพื่อให้รูปบนขึ้นไป)
      const gutter = 30;   // ระยะห่างระหว่างรูปบนกับรูปล่าง (เพิ่มขึ้น)
      
      // 🔥 แก้ไขตรงนี้: ปรับขนาดเป็นมิลลิเมตร (mm) ให้พอดีกับหน้ากว้าง A4
      // ทะเบียนบ้านจริงกว้าง 228 mm ซึ่งเกินหน้า A4 (210 mm) 
      // จึงปรับสเกลย่อลงมาให้กว้าง 180 mm เพื่อให้พิมพ์ลง A4 ได้สวยงาม ไม่หลุดขอบ
      const cardWidth = 170; 
      const cardHeight = 120; // ปรับความสูงตามสัดส่วนเดิม (15.5 / 22.8 * 180)
      
      const cardX = (pageWidth - cardWidth) / 2; // จัดกึ่งกลางแนวนอน

      const images = await Promise.all([selectedFiles[0], selectedFiles[1]].map(async file => {
        const imgData = await fileToBase64(file);
        const img = new Image();
        img.src = imgData;
        await new Promise(resolve => img.onload = resolve);
        return img;
      }));

      images.forEach((img, index) => {
        const y = margin + index * (cardHeight + gutter);
        const scale = Math.min(cardWidth / img.width, cardHeight / img.height);
        const imgWidth = img.width * scale;
        const imgHeight = img.height * scale;
        const imgX = cardX + (cardWidth - imgWidth) / 2;
        const imgY = y + (cardHeight - imgHeight) / 2;

        pdf.addImage(img, 'JPEG', imgX, imgY, imgWidth, imgHeight);
      });

      if (download) {
        pdf.save('house-registration-copy.pdf');
      } else {
        const blobUrl = pdf.output('bloburl');
        window.open(blobUrl, '_blank');
      }

      loading.classList.add('hidden');
    }

    async function convertToA4Grid(download) {
      if (!selectedFiles.length) {
        alert('กรุณาเลือกรูปก่อน');
        return;
      }

      const loading = document.getElementById('loading');
      loading.classList.remove('hidden');

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const margin = 12;
      const gutter = 6;
      const usableWidth = pageWidth - margin * 2;
      const usableHeight = pageHeight - margin * 2;

      const images = await Promise.all(selectedFiles.map(async file => {
        const imgData = await fileToBase64(file);
        const img = new Image();
        img.src = imgData;
        await new Promise(resolve => img.onload = resolve);
        return img;
      }));

      const maxPerPage = 9;
      const pages = Math.ceil(images.length / maxPerPage);

      for (let pageIndex = 0; pageIndex < pages; pageIndex++) {
        if (pageIndex > 0) pdf.addPage();
        const pageImages = images.slice(pageIndex * maxPerPage, pageIndex * maxPerPage + maxPerPage);
        const count = pageImages.length;
        let cols, rows;

        if (count === 1) {
          cols = 1;
          rows = 1;
        } else if (count === 2) {
          cols = 2;
          rows = 1;
        } else if (count === 3) {
          cols = 3;
          rows = 1;
        } else if (count === 4) {
          cols = 2;
          rows = 2;
        } else if (count <= 6) {
          cols = 3;
          rows = 2;
        } else {
          cols = 3;
          rows = 3;
        }

        const cellWidth = (usableWidth - gutter * (cols - 1)) / cols;
        const cellHeight = (usableHeight - gutter * (rows - 1)) / rows;

        pageImages.forEach((img, index) => {
          const col = index % cols;
          const row = Math.floor(index / cols);
          const x = margin + col * (cellWidth + gutter);
          const y = margin + row * (cellHeight + gutter);
          const scale = Math.min(cellWidth / img.width, cellHeight / img.height);
          const imgWidth = img.width * scale;
          const imgHeight = img.height * scale;
          const imgX = x + (cellWidth - imgWidth) / 2;
          const imgY = y + (cellHeight - imgHeight) / 2;

          pdf.setDrawColor(180);
          pdf.setLineWidth(0.2);
          pdf.rect(x, y, cellWidth, cellHeight, 'S');
          pdf.addImage(img, 'JPEG', imgX, imgY, imgWidth, imgHeight);
        });
      }

      if (download) {
        pdf.save('images-a4-grid.pdf');
      } else {
        const blobUrl = pdf.output('bloburl');
        window.open(blobUrl, '_blank');
      }

      loading.classList.add('hidden');
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }
  </script>

</body>
</html>
